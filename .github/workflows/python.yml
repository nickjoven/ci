name: python

# Reusable Python CI. Callers reference this instead of reproducing it:
#
#   jobs:
#     ci:
#       uses: nickjoven/ci/.github/workflows/python.yml@main
#
# Defaults are deliberately tolerant. A rollout that turns eight repos red
# on day one is worse than no CI at all — it trains you to ignore the
# notification, which is the failure mode this whole system exists to avoid.
# Tighten per-repo with `strict: true` once a repo is actually clean.

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      strict:
        description: Fail on lint findings. Off by default during adoption.
        type: boolean
        default: false
      run-tests:
        description: Run pytest if a test suite is detected.
        type: boolean
        default: true

jobs:
  check:
    name: lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: install tooling
        run: python -m pip install --quiet --upgrade pip ruff pytest

      - name: install project
        run: |
          if [ -f pyproject.toml ]; then
            pip install --quiet -e . || echo "::warning::editable install failed — linting source only"
          elif [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt || echo "::warning::requirements install failed"
          fi

      - name: syntax check
        run: |
          # Always blocking: a file that does not parse is never acceptable.
          python -m compileall -q . > /dev/null

      - name: lint
        run: |
          if [ "${{ inputs.strict }}" = "true" ]; then
            ruff check .
          else
            ruff check . --exit-zero
          fi

      - name: test
        if: inputs.run-tests
        run: |
          if [ -d tests ] || ls test_*.py *_test.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "no test suite detected — skipping"
          fi
